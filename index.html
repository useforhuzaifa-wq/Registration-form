
<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Login page</title>
   <link rel="stylesheet" href="/my first website/style.css">
</head>
<body>
   <form action="">
   <label>
      First name
   </label>
   <br>
   <input type="text" name="username" placeholder="username" required>
   <br>
   <br>
   <label>Last Name</label>
   <br>
   <input type="text" name="Lastname"
   placeholder="Lastname" required>
   <br>
   <br>
   <label>Email</label>
   <br>
   <input type="email" name="email" placeholder="enter your email" required>
   <br>
   <br>
   <label>Date Of Birth</label>
   <br>
   <input type="date" name="Date Of Birth">
   <br>
   <br>
   <label>Password</label>
   <br>
   <input type="password" name="password" placeholder="Password" required>
   <br>
   <br>
   <label>Confirm Password</label>
   <br>
   <input type="password" name="Confirm Password" placeholder="Re-enter password" required>
   <br>
   <br>
   <label>Contact</label>
   <br>
   <input type="tel" name="Contact" placeholder="03xx-xxxxxxx" required>
   <br>
   <br>
   <label>Gender</label>
   <br>
   <input type="radio" name="Gender" value="fml">Female
   <input type="radio" name="Gender" value="Mal">Male
   <br>
   <br>
   <button>Submit</button>
   </form>
</body>
</html>
